# Prompt otimizado para converter relatos de bugs em User Stories profissionais
# Técnicas aplicadas: Role Prompting, Few-shot Learning, Chain of Thought, Skeleton of Thought

bug_to_user_story_v2:
  description: "Prompt otimizado para converter relatos de bugs em User Stories profissionais usando Role Prompting, Few-shot Learning e Chain of Thought"
  version: "v2"
  created_at: "2025-01-20"
  techniques_applied:
    - "Role Prompting"
    - "Few-shot Learning"
    - "Chain of Thought"
    - "Skeleton of Thought"
  tags:
    - "bug-analysis"
    - "user-story"
